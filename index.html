      // Only prevent touch gestures here, let main.tsx handle viewport management
      (function() {
        var lastTouchEnd = 0;
        document.addEventListener('touchstart', function(e) {
          if (e.target && e.target.closest && e.target.closest('[data-fullscreen-image-viewer]')) {
            return;
          }
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });
        
        document.addEventListener('touchend', function(e) {
          if (e.target && e.target.closest && e.target.closest('[data-fullscreen-image-viewer]')) {
            return;
          }
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
