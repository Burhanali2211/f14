<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f3d3a"/>
      <stop offset="50%" stop-color="#1a5c4d"/>
      <stop offset="100%" stop-color="#0d2e2c"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC125"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg1)"/>
  <g opacity="0.1" fill="#FFD700">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="700" cy="100" r="80"/>
    <circle cx="100" cy="700" r="80"/>
    <circle cx="700" cy="700" r="80"/>
  </g>
  <g transform="translate(400,400)" filter="url(#glow)">
    <path d="M0,-120 L10,-40 L80,-40 L20,10 L40,90 L0,40 L-40,90 L-20,10 L-80,-40 L-10,-40 Z" fill="url(#gold1)" opacity="0.9"/>
    <circle cx="0" cy="0" r="25" fill="#0f3d3a"/>
    <text x="0" y="8" text-anchor="middle" fill="url(#gold1)" font-family="serif" font-size="28" font-weight="bold">۞</text>
  </g>
  <g stroke="url(#gold1)" fill="none" opacity="0.4">
    <circle cx="400" cy="400" r="180" stroke-width="2"/>
    <circle cx="400" cy="400" r="220" stroke-width="1" stroke-dasharray="10,5"/>
  </g>
  <g fill="url(#gold1)" opacity="0.6">
    <rect x="380" y="580" width="40" height="100" rx="5"/>
    <ellipse cx="400" cy="560" rx="60" ry="30"/>
    <path d="M340,560 Q400,500 460,560" stroke="url(#gold1)" stroke-width="3" fill="none"/>
  </g>
</svg>