<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1f1f"/>
      <stop offset="50%" stop-color="#4a2c2c"/>
      <stop offset="100%" stop-color="#1a1212"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ee5a5a"/>
      <stop offset="100%" stop-color="#cc4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg3)"/>
  <g opacity="0.1" fill="#ff6b6b">
    <circle cx="200" cy="200" r="150"/>
    <circle cx="600" cy="600" r="150"/>
  </g>
  <g transform="translate(400,400)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#rose)" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#rose)" stroke-width="2" opacity="0.4"/>
    <g fill="url(#rose)" opacity="0.8">
      <ellipse cx="0" cy="-50" rx="15" ry="25"/>
      <ellipse cx="43" cy="-25" rx="15" ry="25" transform="rotate(60)"/>
      <ellipse cx="43" cy="25" rx="15" ry="25" transform="rotate(120)"/>
      <ellipse cx="0" cy="50" rx="15" ry="25"/>
      <ellipse cx="-43" cy="25" rx="15" ry="25" transform="rotate(-120)"/>
      <ellipse cx="-43" cy="-25" rx="15" ry="25" transform="rotate(-60)"/>
    </g>
    <circle cx="0" cy="0" r="20" fill="#4a2c2c"/>
    <text x="0" y="7" text-anchor="middle" fill="url(#rose)" font-family="serif" font-size="20">❀</text>
  </g>
  <g stroke="url(#rose)" fill="none" opacity="0.3" stroke-width="1">
    <path d="M100,100 Q400,50 700,100"/>
    <path d="M100,700 Q400,750 700,700"/>
  </g>
  <text x="400" y="650" text-anchor="middle" fill="url(#rose)" font-family="serif" font-size="24" opacity="0.5">السلام</text>
</svg>